AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Amazon CloudWatch monitoring for the app - alarms that email you, and a dashboard
  with the key numbers on one screen.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
  AlertEmail:
    Type: String
    Description: Email address that receives alarm notifications
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  LoadBalancerFullName:
    Type: String
  TargetGroupFullName:
    Type: String
  LogGroupName:
    Type: String

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${EnvironmentName}-alarms
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail # you must click "Confirm subscription" in the email

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-high-cpu
      AlarmDescription: ECS service CPU above 80% for 10 minutes
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref ClusterName }
        - { Name: ServiceName, Value: !Ref ServiceName }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-high-memory
      AlarmDescription: ECS service memory above 80% for 10 minutes
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref ClusterName }
        - { Name: ServiceName, Value: !Ref ServiceName }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-unhealthy-targets
      AlarmDescription: The load balancer sees at least one unhealthy container
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !Ref LoadBalancerFullName }
        - { Name: TargetGroup, Value: !Ref TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-http-5xx
      AlarmDescription: The app returned more than 5 server errors in 5 minutes
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !Ref LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Turns "unhandled_exception" log lines into a metric you can alarm on
  AppErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: !Sub ${ProjectName}/${EnvironmentName}
          MetricName: AppErrors
          MetricValue: "1"
          DefaultValue: 0

  AppErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-app-errors
      AlarmDescription: The app logged ERROR lines
      Namespace: !Sub ${ProjectName}/${EnvironmentName}
      MetricName: AppErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectName}-${EnvironmentName}
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "ECS CPU and memory (%)", "region": "${AWS::Region}", "stat": "Average", "period": 60,
               "metrics": [["AWS/ECS", "CPUUtilization", "ClusterName", "${ClusterName}", "ServiceName", "${ServiceName}"],
                           [".", "MemoryUtilization", ".", ".", ".", "."]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
               "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancerFullName}"],
                           [".", "HTTPCode_Target_5XX_Count", ".", "."],
                           [".", "HTTPCode_Target_4XX_Count", ".", "."]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "Response time (seconds, p95)", "region": "${AWS::Region}", "stat": "p95", "period": 60,
               "metrics": [["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancerFullName}"]]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "Healthy vs unhealthy containers", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
               "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "LoadBalancer", "${LoadBalancerFullName}", "TargetGroup", "${TargetGroupFullName}"],
                           [".", "UnHealthyHostCount", ".", ".", ".", "."]]}},
            {"type": "log", "x": 0, "y": 12, "width": 24, "height": 6,
             "properties": {"title": "Latest app errors", "region": "${AWS::Region}",
               "query": "SOURCE '${LogGroupName}' | fields @timestamp, @message | filter level = 'ERROR' | sort @timestamp desc | limit 20"}}
          ]
        }

Outputs:
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ProjectName}-${EnvironmentName}
  AlarmTopicArn:
    Value: !Ref AlarmTopic
