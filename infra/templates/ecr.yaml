AWSTemplateFormatVersion: "2010-09-09"
Description: Private Amazon ECR repository for the app's container images.

Parameters:
  RepositoryName:
    Type: String

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE # a tag can never be overwritten: what was scanned is what runs
      ImageScanningConfiguration:
        ScanOnPush: true # free AWS basic scan - a second opinion next to Trivy
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true # lets "sceptre delete" remove the repo even if it has images
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the last 10 images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
              "action": {"type": "expire"}
            }]
          }

Outputs:
  RepositoryName:
    Value: !Ref Repository
  RepositoryArn:
    Value: !GetAtt Repository.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
