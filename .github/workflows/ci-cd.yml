name: CI-CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. Jobs ask for more only when they need it.
permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: secure-cicd-app
  TRIVY_VERSION: "0.74.0"

jobs:
  # -----------------------------------------------------------------
  # 1. Lint + automated tests
  # -----------------------------------------------------------------
  test:
    name: 1. Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest --cov=app --cov-report=term-missing

      - name: Validate CloudFormation templates (cfn-lint)
        run: |
          pip install -r requirements-infra.txt
          cfn-lint infra/templates/*.yaml

  # -----------------------------------------------------------------
  # 2. Security scans: Bandit (code) + Docker build + Trivy (image)
  # -----------------------------------------------------------------
  security-scan:
    name: 2. Build and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install -r requirements-dev.txt

      - name: Bandit - scan Python code
        run: |
          mkdir -p reports
          bandit -r app scripts -c pyproject.toml -f json -o reports/bandit.json || true
          bandit -r app scripts -c pyproject.toml || true   # readable copy in the log

      - name: Build Docker image
        run: docker build -t ${IMAGE_NAME}:${{ github.sha }} .

      - name: Trivy - scan the container image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:${TRIVY_VERSION} image \
              --severity HIGH,CRITICAL --format json --output /reports/trivy.json \
              ${IMAGE_NAME}:${{ github.sha }}
          # Same results as a readable table in the log
          docker run --rm -v "$PWD/reports:/reports" \
            aquasec/trivy:${TRIVY_VERSION} convert --format table /reports/trivy.json

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 14

      - name: Security gate (fails the run on serious findings)
        run: python scripts/security_gate.py --bandit reports/bandit.json --trivy reports/trivy.json

      # Save the exact image that was scanned, so we deploy what we tested
      - name: Save image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save ${IMAGE_NAME}:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar.gz
          retention-days: 1

  # -----------------------------------------------------------------
  # 3. Deploy to Amazon ECS - only on main, only if tests + scans passed
  # -----------------------------------------------------------------
  deploy:
    name: 3. Deploy to Amazon ECS
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The AWS keys are stored in this GitHub environment, which only the main branch can use
    environment: aws-main
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Sceptre
        run: pip install -r requirements-infra.txt

      - name: Download the scanned image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      # The CI user can do nothing by itself except step into the deploy role.
      # The pipeline then runs with short-lived (1 hour) deploy-role credentials.
      - name: Log in to AWS (assume the deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          docker tag ${IMAGE_NAME}:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Pushed \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy with Sceptre (CloudFormation -> ECS)
        working-directory: infra
        run: sceptre --var "image_tag=${{ github.sha }}" launch -y dev/app.yaml

      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name secure-cicd-dev-app \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          for i in $(seq 1 10); do
            if curl -fsS "$URL/health"; then
              echo "Live at $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Not ready yet, retrying..."; sleep 10
          done
          echo "Smoke test failed"; exit 1

      # Only runs when something above failed. Gathers CloudFormation, ECS and CloudWatch
      # details so the AI log analysis (and you) can see WHY the deployment failed.
      - name: Collect deployment diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          aws cloudformation describe-stack-events --stack-name secure-cicd-dev-app \
            --max-items 30 --output table > diagnostics/cloudformation-events.txt 2>&1 || true
          aws ecs describe-services --cluster secure-cicd-dev-cluster \
            --services secure-cicd-dev-service \
            --query "services[0].events[:15].[createdAt,message]" --output text \
            > diagnostics/ecs-service-events.txt 2>&1 || true
          TASKS=$(aws ecs list-tasks --cluster secure-cicd-dev-cluster --desired-status STOPPED \
            --query "taskArns[:5]" --output text 2>/dev/null || true)
          if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
            aws ecs describe-tasks --cluster secure-cicd-dev-cluster --tasks $TASKS \
              --query "tasks[].[stoppedReason,containers[0].reason,containers[0].exitCode]" \
              --output text > diagnostics/ecs-stopped-tasks.txt 2>&1 || true
          fi
          aws logs tail /ecs/secure-cicd-dev-app --since 30m \
            > diagnostics/cloudwatch-app-logs.txt 2>&1 || true

      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics
          path: diagnostics/
          retention-days: 14
